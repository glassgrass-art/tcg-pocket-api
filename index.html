<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Pocket - 树状交换广场</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">
    
    <!-- 顶部标题栏 -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent">
                    TCG Pocket 交换广场 (分支树模式)
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">点击下方稀有度分支，按同等阶梯挑选卡牌并标记“我有/求”</p>
            </div>
            
            <button onclick="exportTradeList()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-colors shadow flex items-center gap-2">
                📋 生成我的交换清单文案 (<span id="totalTradeCount">0</span>)
            </button>
        </div>
    </header>

    <!-- 分支树导航栏 (Branching Tree Path) -->
    <nav class="bg-slate-800/90 backdrop-blur border-b border-slate-700 py-3 px-4 sticky top-[73px] z-40 shadow-inner">
        <div class="max-w-7xl mx-auto flex flex-col gap-3">
            
            <!-- 根分支：大分类选择 -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
                <span class="text-slate-400 font-bold whitespace-nowrap">1. 选择大类：</span>
                <button onclick="selectCategory('diamond')" id="cat-diamond" class="category-btn px-3 py-1.5 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all whitespace-nowrap">
                    💎 菱形系列 (Common/Uncommon)
                </button>
                <button onclick="selectCategory('star')" id="cat-star" class="category-btn px-3 py-1.5 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all whitespace-nowrap">
                    ⭐ 星星系列 (Standard/Rare)
                </button>
                <button onclick="selectCategory('shiny')" id="cat-shiny" class="category-btn px-3 py-1.5 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all whitespace-nowrap">
                    ✨ 彩色闪卡 (AR / SAR)
                </button>
                <button onclick="selectCategory('crown')" id="cat-crown" class="category-btn px-3 py-1.5 rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all whitespace-nowrap">
                    👑 皇冠卡 (Crown)
                </button>
            </div>

            <!-- 子分支：具体稀有度细分（根据大类动态展开） -->
            <div id="subCategoryContainer" class="flex items-center gap-2 overflow-x-auto pt-1 border-t border-slate-700/50 text-xs hidden">
                <span class="text-amber-400 font-bold whitespace-nowrap">2. 选择精确稀有度：</span>
                <div id="subCategoryButtons" class="flex gap-2"></div>
            </div>

        </div>
    </nav>

    <!-- 主体卡牌展示区 -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="tipContainer" class="text-center py-24 text-slate-400 bg-slate-800/20 rounded-2xl border border-dashed border-slate-700">
            <p class="text-lg font-medium text-slate-300">🌳 请从上方分支树中选择您要交易的【稀有度分支】</p>
            <p class="text-xs text-slate-500 mt-1">系统将自动为您拉取全卡包中符合该同等阶梯的卡牌</p>
        </div>
        
        <div id="loading" class="hidden text-center py-20 text-slate-400">正在载入该分支下的卡牌矩阵...</div>
        <div id="errorMsg" class="hidden text-center py-10 text-rose-400 bg-rose-950/30 rounded-xl border border-rose-800/50 mb-6"></div>
        <div id="contentContainer" class="space-y-10"></div>
    </main>

    <!-- 弹窗：导出交换清单 -->
    <div id="modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-slate-100 flex justify-between items-center">
                <span>分支树交换清单</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
            </h3>
            <textarea id="tradeTextResult" class="w-full h-40 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-300 font-mono focus:outline-none" readonly></textarea>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm">关闭</button>
                <button onclick="copyTradeText()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg text-sm">一键复制文本</button>
            </div>
        </div>
    </div>

    <!-- 业务脚本逻辑 -->
    <script>
        let userTradeData = JSON.parse(localStorage.getItem('tcg_trade_data') || '{"have": {}, "want": {}}');
        let currentSelectedRarity = '';

        // 分支树定义字典
        const treeSubCategories = {
            diamond: [
                { id: '1diamond', label: '◇ (1 钻)' },
                { id: '2diamond', label: '◇◇ (2 钻)' },
                { id: '3diamond', label: '◇◇◇ (3 钻)' },
                { id: '4diamond', label: '◇◇◇◇ (4 钻)' }
            ],
            star: [
                { id: '1star', label: '☆ (普通一星)' },
                { id: '2star', label: '☆☆ (普通二星)' },
                { id: '3star', label: '☆☆☆ (普通三星)' }
            ],
            shiny: [
                { id: 'shinystar1', label: '★ (彩色一星 / AR)' },
                { id: 'shinystar2', label: '★★ (彩色二星 / SAR)' }
            ],
            crown: [
                { id: 'crown', label: '👑 (皇冠卡)' }
            ]
        };

        // 第一步：点击大类根分支
        function selectCategory(categoryKey) {
            // 高亮大类按钮
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-slate-950', 'font-bold');
                btn.classList.add('bg-slate-700', 'text-slate-300');
            });
            const activeCatBtn = document.getElementById(`cat-${categoryKey}`);
            activeCatBtn.classList.remove('bg-slate-700', 'text-slate-300');
            activeCatBtn.classList.add('bg-amber-500', 'text-slate-950', 'font-bold');

            // 渲染子分支节点
            const subContainer = document.getElementById('subCategoryContainer');
            const subButtons = document.getElementById('subCategoryButtons');
            subButtons.innerHTML = '';
            subContainer.classList.remove('hidden');

            const subs = treeSubCategories[categoryKey] || [];
            subs.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'sub-btn px-3 py-1 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs transition-all font-mono';
                btn.textContent = sub.label;
                btn.onclick = () => selectSubCategory(sub.id, btn);
                subButtons.appendChild(btn);
            });

            // 默认自动选中该大类的第一个子分支
            if (subs.length > 0) {
                subButtons.children[0].click();
            }
        }

        // 第二步：点击具体子分支叶子节点
        function selectSubCategory(rarityId, btnElement) {
            document.querySelectorAll('.sub-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white', 'font-bold');
                b.classList.add('bg-slate-700', 'text-slate-200');
            });
            btnElement.classList.remove('bg-slate-700', 'text-slate-200');
            btnElement.classList.add('bg-indigo-600', 'text-white', 'font-bold');

            currentSelectedRarity = rarityId;
            fetchCardsByRarity(rarityId);
        }

        // 根据稀有度向后端请求全卡包对应卡牌
        async function fetchCardsByRarity(rarity) {
            const container = document.getElementById('contentContainer');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');
            const tipContainer = document.getElementById('tipContainer');

            tipContainer.style.display = 'none';
            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            container.innerHTML = '';

            try {
                const res = await fetch(`/api/cards?rarity=${rarity}`);
                const json = await res.json();

                if (!json.success) throw new Error(json.error || '获取数据失败');

                const sets = json.data;
                loading.style.display = 'none';
                updateTotalTradeCount();

                if (sets.length === 0) {
                    container.innerHTML = `<div class="text-center py-20 text-slate-500">当前分支下暂无卡牌数据</div>`;
                    return;
                }

                // 按扩展包分支批量渲染
                sets.forEach(set => {
                    const section = document.createElement('div');
                    section.className = 'bg-slate-800/40 rounded-2xl p-6 border border-slate-700/60 shadow-lg';
                    
                    let cardsHtml = set.cards.map(card => {
                        const isHave = !!userTradeData.have[card.id];
                        const isWant = !!userTradeData.want[card.id];

                        return `
                            <div class="bg-slate-800 rounded-xl overflow-hidden border ${isHave ? 'border-emerald-500/80 shadow-emerald-900/20' : isWant ? 'border-rose-500/80 shadow-rose-900/20' : 'border-slate-700'} hover:border-amber-400/50 transition-all group flex flex-col">
                                <div class="aspect-[3/4] bg-slate-900 relative overflow-hidden flex items-center justify-center p-2">
                                    <img src="${card.image}" alt="${card.name}" loading="lazy" class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300">
                                    <div class="absolute top-2 left-2 flex flex-col gap-1">
                                        ${isHave ? '<span class="bg-emerald-500 text-slate-950 text-[10px] font-bold px-1.5 py-0.5 rounded shadow">我有</span>' : ''}
                                        ${isWant ? '<span class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">求</span>' : ''}
                                    </div>
                                </div>
                                <div class="p-3 flex flex-col flex-grow justify-between">
                                    <div>
                                        <div class="text-xs text-amber-400 font-mono mb-1">${card.id}</div>
                                        <h3 class="font-bold text-sm text-slate-100 truncate">${card.name}</h3>
                                    </div>
                                    <div class="mt-3 pt-2 border-t border-slate-700/50 flex justify-between gap-2">
                                        <button onclick="toggleStatus('${card.id}', 'have')" class="flex-1 py-1 px-2 rounded text-xs font-semibold transition-colors ${isHave ? 'bg-emerald-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}">我有</button>
                                        <button onclick="toggleStatus('${card.id}', 'want')" class="flex-1 py-1 px-2 rounded text-xs font-semibold transition-colors ${isWant ? 'bg-rose-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}">求</button>
                                    </div>
                                    <div class="mt-1 text-center text-[10px] text-slate-500 font-mono">${card.rarity}</div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    section.innerHTML = `
                        <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-700">
                            <h2 class="text-xl font-bold text-slate-200">${set.setName}</h2>
                            <span class="text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-full">共 ${set.totalCards} 张同级卡牌</span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                            ${cardsHtml}
                        </div>
                    `;
                    container.appendChild(section);
                });

            } catch (err) {
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
                errorMsg.textContent = `加载出错: ${err.message}`;
            }
        }

        // 切换“我有 / 求”状态
        function toggleStatus(cardId, type) {
            if (type === 'have') {
                if (userTradeData.have[cardId]) delete userTradeData.have[cardId];
                else { userTradeData.have[cardId] = true; delete userTradeData.want[cardId]; }
            } else if (type === 'want') {
                if (userTradeData.want[cardId]) delete userTradeData.want[cardId];
                else { userTradeData.want[cardId] = true; delete userTradeData.have[cardId]; }
            }
            localStorage.setItem('tcg_trade_data', JSON.stringify(userTradeData));
            updateTotalTradeCount();
            if (currentSelectedRarity) fetchCardsByRarity(currentSelectedRarity);
        }

        function updateTotalTradeCount() {
            const total = Object.keys(userTradeData.have).length + Object.keys(userTradeData.want).length;
            document.getElementById('totalTradeCount').textContent = total;
        }

        // 导出文案
        function exportTradeList() {
            let text = `【Pokémon TCG Pocket 分支树交换清单】\n----------------------------------\n🟢 我有的重复卡（可出）：\n`;
            const haveIds = Object.keys(userTradeData.have);
            text += haveIds.length === 0 ? `暂无\n` : haveIds.join(', ') + `\n`;
            text += `\n🔴 我在求的卡（愿收）：\n`;
            const wantIds = Object.keys(userTradeData.want);
            text += wantIds.length === 0 ? `暂无\n` : wantIds.join(', ') + `\n`;
            text += `----------------------------------\n寻找同稀有度等价交换！`;

            document.getElementById('tradeTextResult').value = text;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function copyTradeText() {
            document.getElementById('tradeTextResult').select();
            document.execCommand('copy');
            alert('已成功复制交换清单文案！');
        }

        // 初始化加载计数
        updateTotalTradeCount();
    </script>
</body>
</html>
