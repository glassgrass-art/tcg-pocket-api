<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Pocket - 同稀有度卡牌交换广场</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">
    
    <!-- 顶部标题栏 -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent">
                    TCG Pocket 卡牌交换广场
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">严格遵循同稀有度等价交换，先选择目标稀有度，再通过卡包分支树展开勾选</p>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- 当前选中的稀有度状态提示 -->
                <div id="currentRarityBadge" class="hidden text-xs bg-indigo-950 border border-indigo-500/50 text-indigo-300 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span>当前锁定稀有度: <strong id="activeRarityText" class="text-white font-mono">未选择</strong></span>
                    <button onclick="resetRarity()" class="text-rose-400 hover:text-rose-300 font-bold ml-1">✖ 重置</button>
                </div>

                <button onclick="exportTradeList()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-colors shadow flex items-center gap-2">
                    📋 生成交换清单文案 (<span id="totalTradeCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- 第一步：稀有度选择卡片网格 -->
        <div id="raritySelectorSection" class="space-y-4">
            <div class="flex items-center gap-2 border-b border-slate-700 pb-2">
                <span class="bg-amber-500 text-slate-950 font-bold text-xs px-2 py-0.5 rounded">第一步</span>
                <h2 class="text-base font-bold text-slate-200">选择您要交易的【目标稀有度】（同阶梯交换）</h2>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                <button onclick="selectRarity('1diamond', '◇ (1 钻石)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-amber-400 group-hover:scale-105 transition-transform">◇</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">1 钻石</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Common</div>
                </button>
                <button onclick="selectRarity('2diamond', '◇◇ (2 钻石)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-amber-400 group-hover:scale-105 transition-transform">◇◇</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">2 钻石</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Uncommon</div>
                </button>
                <button onclick="selectRarity('3diamond', '◇◇◇ (3 钻石)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-amber-400 group-hover:scale-105 transition-transform">◇◇◇</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">3 钻石</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Rare</div>
                </button>
                <button onclick="selectRarity('4diamond', '◇◇◇◇ (4 钻石)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-amber-400 group-hover:scale-105 transition-transform">◇◇◇◇</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">4 钻石</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Double Rare (EX)</div>
                </button>
                <button onclick="selectRarity('1star', '☆ (普通一星)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-yellow-400 group-hover:scale-105 transition-transform">☆</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">普通一星</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Rare (⭐)</div>
                </button>
                <button onclick="selectRarity('2star', '☆☆ (普通二星)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-yellow-400 group-hover:scale-105 transition-transform">☆☆</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">普通二星</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Super Rare (SR)</div>
                </button>
                <button onclick="selectRarity('3star', '☆☆☆ (普通三星)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-yellow-400 group-hover:scale-105 transition-transform">☆☆☆</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">普通三星</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Ultra Rare (UR)</div>
                </button>
                <button onclick="selectRarity('shinystar1', '★ (彩色一星 / AR)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-emerald-400 group-hover:scale-105 transition-transform">★</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">彩色一星 (AR)</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Art Rare</div>
                </button>
                <button onclick="selectRarity('shinystar2', '★★ (彩色二星 / SAR)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-emerald-400 group-hover:scale-105 transition-transform">★★</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">彩色二星 (SAR)</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Special Art Rare</div>
                </button>
                <button onclick="selectRarity('crown', '👑 (皇冠卡)')" class="rarity-card p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left transition-all group">
                    <div class="text-lg font-bold text-rose-400 group-hover:scale-105 transition-transform">👑</div>
                    <div class="text-sm font-medium text-slate-200 mt-2">皇冠卡</div>
                    <div class="text-[10px] text-slate-500 mt-0.5">Immersive / Crown</div>
                </button>
            </div>
        </div>

        <!-- 第二步：扩展包手风琴分支树 (Accordion Tree) -->
        <div id="treeContainerSection" class="mt-8 hidden space-y-4">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                <div class="flex items-center gap-2">
                    <span class="bg-indigo-600 text-white font-bold text-xs px-2 py-0.5 rounded">第二步</span>
                    <h2 class="text-base font-bold text-slate-200">展开扩展包分支树，勾选您的“我有/求”卡牌</h2>
                </div>
                <span class="text-xs text-slate-400 font-mono" id="selectedRarityIndicator"></span>
            </div>

            <div id="loading" class="text-center py-16 text-slate-400">正在载入卡包分支数据...</div>
            <div id="errorMsg" class="hidden text-center py-10 text-rose-400 bg-rose-950/30 rounded-xl border border-rose-800/50 mb-6"></div>
            
            <!-- 手风琴列表容器 -->
            <div id="accordionContainer" class="space-y-4"></div>
        </div>

    </main>

    <!-- 弹窗：导出交换清单 -->
    <div id="modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-slate-100 flex justify-between items-center">
                <span>同稀有度交换清单</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
            </h3>
            <textarea id="tradeTextResult" class="w-full h-40 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-300 font-mono focus:outline-none" readonly></textarea>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm">关闭</button>
                <button onclick="copyTradeText()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg text-sm">一键复制文本</button>
            </div>
        </div>
    </div>

    <!-- 业务脚本逻辑 -->
    <script>
        let userTradeData = JSON.parse(localStorage.getItem('tcg_trade_data') || '{"have": {}, "want": {}}');
        let currentRarity = '';
        let currentRarityLabel = '';
        let fetchedSetsCache = [];

        // 第一步：用户选择稀有度
        function selectRarity(rarityKey, rarityLabel) {
            // 如果已经选了别的，给予提示或直接平滑切换
            currentRarity = rarityKey;
            currentRarityLabel = rarityLabel;

            // 更新顶部锁定状态提示
            document.getElementById('activeRarityText').textContent = rarityLabel;
            document.getElementById('currentRarityBadge').classList.remove('hidden');
            document.getElementById('selectedRarityIndicator').textContent = `当前筛选: ${rarityLabel}`;

            // 隐藏第一步选择网格，或者保持并高亮
            document.getElementById('treeContainerSection').classList.remove('hidden');

            // 滚动到第二步区域
            document.getElementById('treeContainerSection').scrollIntoView({ behavior: 'smooth' });

            // 拉取对应稀有度的卡包数据
            fetchCardsTree(rarityKey);
        }

        // 重置稀有度选择
        function resetRarity() {
            if (confirm('更换稀有度将折叠当前卡包树，确定要重新选择吗？')) {
                currentRarity = '';
                currentRarityLabel = '';
                document.getElementById('currentRarityBadge').classList.add('hidden');
                document.getElementById('treeContainerSection').classList.add('hidden');
                document.getElementById('accordionContainer').innerHTML = '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 第二步：请求并渲染手风琴分支树
        async function fetchCardsTree(rarity) {
            const container = document.getElementById('accordionContainer');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');

            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            container.innerHTML = '';

            try {
                const res = await fetch(`/api/cards?rarity=${rarity}`);
                const json = await res.json();

                if (!json.success) throw new Error(json.error || '获取数据失败');

                fetchedSetsCache = json.data;
                loading.style.display = 'none';
                updateTotalTradeCount();

                if (fetchedSetsCache.length === 0) {
                    container.innerHTML = `<div class="text-center py-16 text-slate-500 bg-slate-800/40 rounded-2xl border border-slate-700">该稀有度下暂无卡牌数据</div>`;
                    return;
                }

                // 遍历每个扩展包，构建手风琴节点（默认展开第一个，或者全部展开）
                fetchedSetsCache.forEach((set, index) => {
                    const isOpen = index === 0; // 默认展开第一个卡包
                    const accordionId = `set-panel-${set.setId}`;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'bg-slate-800/60 border border-slate-700 rounded-2xl overflow-hidden shadow-lg transition-all';
                    
                    // 计算该卡包下用户已经标记了多少张
                    let packageHaveCount = 0;
                    let packageWantCount = 0;
                    set.cards.forEach(c => {
                        if (userTradeData.have[c.id]) packageHaveCount++;
                        if (userTradeData.want[c.id]) packageWantCount++;
                    });

                    wrapper.innerHTML = `
                        <!-- 手风琴标题栏 (点击折叠/展开) -->
                        <button onclick="toggleAccordion('${accordionId}', this)" class="w-full px-6 py-4 flex justify-between items-center bg-slate-800 hover:bg-slate-750 transition-colors text-left">
                            <div class="flex items-center gap-3">
                                <span class="text-amber-400 font-mono font-bold text-sm">📁 ${set.setId}</span>
                                <span class="font-bold text-slate-100 text-base">${set.setName}</span>
                                <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-0.5 rounded-full font-mono">共 ${set.totalCards} 张</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-xs flex gap-3 font-mono">
                                    ${packageHaveCount > 0 ? `<span class="text-emerald-400">我有: ${packageHaveCount}</span>` : ''}
                                    ${packageWantCount > 0 ? `<span class="text-rose-400">求: ${packageWantCount}</span>` : ''}
                                </div>
                                <span class="transform transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}" id="arrow-${accordionId}">▼</span>
                            </div>
                        </button>

                        <!-- 手风琴内容面板 (卡牌网格) -->
                        <div id="${accordionId}" class="${isOpen ? '' : 'hidden'} p-6 border-t border-slate-700/60 bg-slate-900/40">
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                ${set.cards.map(card => {
                                    const isHave = !!userTradeData.have[card.id];
                                    const isWant = !!userTradeData.want[card.id];

                                    return `
                                        <div class="bg-slate-800 rounded-xl overflow-hidden border ${isHave ? 'border-emerald-500/80 shadow-emerald-900/20' : isWant ? 'border-rose-500/80 shadow-rose-900/20' : 'border-slate-700'} hover:border-amber-400/50 transition-all group flex flex-col">
                                            <div class="aspect-[3/4] bg-slate-900 relative overflow-hidden flex items-center justify-center p-2">
                                                <img src="${card.image}" alt="${card.name}" loading="lazy" class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300">
                                                <div class="absolute top-2 left-2 flex flex-col gap-1">
                                                    ${isHave ? '<span class="bg-emerald-500 text-slate-950 text-[10px] font-bold px-1.5 py-0.5 rounded shadow">我有</span>' : ''}
                                                    ${isWant ? '<span class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">求</span>' : ''}
                                                </div>
                                            </div>
                                            <div class="p-3 flex flex-col flex-grow justify-between">
                                                <div>
                                                    <div class="text-xs text-amber-400 font-mono mb-1">${card.id}</div>
                                                    <h3 class="font-bold text-sm text-slate-100 truncate">${card.name}</h3>
                                                </div>
                                                <div class="mt-3 pt-2 border-t border-slate-700/50 flex justify-between gap-2">
                                                    <button onclick="toggleStatus('${card.id}', 'have')" class="flex-1 py-1 px-2 rounded text-xs font-semibold transition-colors ${isHave ? 'bg-emerald-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}">我有</button>
                                                    <button onclick="toggleStatus('${card.id}', 'want')" class="flex-1 py-1 px-2 rounded text-xs font-semibold transition-colors ${isWant ? 'bg-rose-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}">求</button>
                                                </div>
                                                <div class="mt-1 text-center text-[10px] text-slate-500 font-mono">${card.rarity}</div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                    container.appendChild(wrapper);
                });

            } catch (err) {
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
                errorMsg.textContent = `加载出错: ${err.message}`;
            }
        }

        // 手风琴折叠/展开切换
        function toggleAccordion(panelId, btnElement) {
            const panel = document.getElementById(panelId);
            const arrow = btnElement.querySelector(`#arrow-${panelId}`);
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                panel.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        // 切换“我有 / 求”状态
        function toggleStatus(cardId, type) {
            if (type === 'have') {
                if (userTradeData.have[cardId]) delete userTradeData.have[cardId];
                else { userTradeData.have[cardId] = true; delete userTradeData.want[cardId]; }
            } else if (type === 'want') {
                if (userTradeData.want[cardId]) delete userTradeData.want[cardId];
                else { userTradeData.want[cardId] = true; delete userTradeData.have[cardId]; }
            }
            localStorage.setItem('tcg_trade_data', JSON.stringify(userTradeData));
            updateTotalTradeCount();
            if (currentRarity) fetchCardsTree(currentRarity); // 局部刷新保持状态同步
        }

        function updateTotalTradeCount() {
            const total = Object.keys(userTradeData.have).length + Object.keys(userTradeData.want).length;
            document.getElementById('totalTradeCount').textContent = total;
        }

        // 导出文案
        function exportTradeList() {
            let text = `【Pokémon TCG Pocket 同稀有度交换清单】\n----------------------------------\n🟢 我有的重复卡（可出）：\n`;
            const haveIds = Object.keys(userTradeData.have);
            text += haveIds.length === 0 ? `暂无\n` : haveIds.join(', ') + `\n`;
            text += `\n🔴 我在求的卡（愿收）：\n`;
            const wantIds = Object.keys(userTradeData.want);
            text += wantIds.length === 0 ? `暂无\n` : wantIds.join(', ') + `\n`;
            text += `----------------------------------\n寻找同稀有度等价交换！`;

            document.getElementById('tradeTextResult').value = text;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal'].classList.add('hidden'); }
        function copyTradeText() {
            document.getElementById('tradeTextResult').select();
            document.execCommand('copy');
            alert('已成功复制交换清单文案！');
        }

        updateTotalTradeCount();
    </script>
</body>
</html>
