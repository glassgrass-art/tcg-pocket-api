<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Pocket - Standard Rarity Trade Plaza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">
    
    <!-- 顶部标题栏 -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent">
                    TCG Pocket Trade Plaza
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">Strict equal-rarity trading matching system based on official database tags.</p>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="currentRarityBadge" class="hidden text-xs bg-indigo-950 border border-indigo-500/50 text-indigo-300 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span>Active Rarity: <strong id="activeRarityText" class="text-white font-mono">None</strong></span>
                    <button onclick="resetRarity()" class="text-rose-400 hover:text-rose-300 font-bold ml-1">✖ Reset</button>
                </div>

                <button onclick="exportTradeList()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-colors shadow flex items-center gap-2">
                    📋 Export Trade List (<span id="totalTradeCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- 第一步：官方稀有度图标选择区 -->
        <div id="raritySelectorSection" class="space-y-4">
            <div class="flex items-center gap-2 border-b border-slate-700 pb-2">
                <span class="bg-amber-500 text-slate-950 font-bold text-xs px-2 py-0.5 rounded">Step 1</span>
                <h2 class="text-base font-bold text-slate-200">Select Target Rarity (Equal-Tier Trading)</h2>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-9 gap-2.5">
                
                <!-- C: 1 Diamond -->
                <button onclick="selectRarity('C', '◇ Common (C)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="C" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-slate-200">C</div>
                        <div class="text-[10px] text-slate-400">Common</div>
                    </div>
                </button>

                <!-- U: 2 Diamonds -->
                <button onclick="selectRarity('U', '◇◇ Uncommon (U)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="U" class="w-3.5 h-3.5 object-contain">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="U" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-slate-200">U</div>
                        <div class="text-[10px] text-slate-400">Uncommon</div>
                    </div>
                </button>

                <!-- R: 3 Diamonds -->
                <button onclick="selectRarity('R', '◇◇◇ Rare (R)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="R" class="w-3.5 h-3.5 object-contain">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="R" class="w-3.5 h-3.5 object-contain">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="R" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-amber-400">R</div>
                        <div class="text-[10px] text-slate-400">Rare</div>
                    </div>
                </button>

                <!-- RR: 4 Diamonds -->
                <button onclick="selectRarity('RR', '◇◇◇◇ Double Rare (RR)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="RR" class="w-3.5 h-3.5 object-contain">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="RR" class="w-3.5 h-3.5 object-contain">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="RR" class="w-3.5 h-3.5 object-contain">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/diamond.webp" alt="RR" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-amber-400">RR</div>
                        <div class="text-[10px] text-slate-400">Double Rare</div>
                    </div>
                </button>

                <!-- AR: 1 Star -->
                <button onclick="selectRarity('AR', '★ Art Rare (AR)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/star.webp" alt="AR" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-emerald-400">AR</div>
                        <div class="text-[10px] text-slate-400">Art Rare</div>
                    </div>
                </button>

                <!-- SR / SAR: 2 Stars -->
                <button onclick="selectRarity('SR', '☆☆ Super Rare (SR / SAR)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/star.webp" alt="SR" class="w-3.5 h-3.5 object-contain">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/star.webp" alt="SR" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-yellow-400">SR / SAR</div>
                        <div class="text-[10px] text-slate-400">Super / Special</div>
                    </div>
                </button>

                <!-- UR: 1 Crown -->
                <button onclick="selectRarity('UR', '👑 Crown Rare (UR)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/crown.webp" alt="UR" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-rose-400">UR</div>
                        <div class="text-[10px] text-slate-400">Crown Rare</div>
                    </div>
                </button>

                <!-- S: 1 Shiny Star -->
                <button onclick="selectRarity('S', '✨ Shiny (S)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-cyan-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/shiny-star.webp" alt="S" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-cyan-400">S</div>
                        <div class="text-[10px] text-slate-400">Shiny</div>
                    </div>
                </button>

                <!-- SSR: 2 Shiny Stars -->
                <button onclick="selectRarity('SSR', '✨✨ Shiny Super Rare (SSR)')" class="rarity-card p-3 rounded-xl bg-slate-800 border border-slate-700 hover:border-cyan-400 flex flex-col items-start gap-1.5 transition-all group">
                    <div class="flex items-center gap-0.5 h-4">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/shiny-star.webp" alt="SSR" class="w-3.5 h-3.5 object-contain">
                        <img src="https://raw.githubusercontent.com/glassgrass-art/tcg-pocket-api/main/dist/images/rarities/shiny-star.webp" alt="SSR" class="w-3.5 h-3.5 object-contain">
                    </div>
                    <div>
                        <div class="text-xs font-bold text-cyan-300">SSR</div>
                        <div class="text-[10px] text-slate-400">Shiny Super</div>
                    </div>
                </button>

            </div>
        </div>

        <!-- 第二步：扩展包手风琴分支树 -->
        <div id="treeContainerSection" class="mt-8 hidden space-y-4">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                <div class="flex items-center gap-2">
                    <span class="bg-indigo-600 text-white font-bold text-xs px-2 py-0.5 rounded">Step 2</span>
                    <h2 class="text-base font-bold text-slate-200">Expansion Branch Tree - Select Have / Want</h2>
                </div>
                <span class="text-xs text-slate-400 font-mono" id="selectedRarityIndicator"></span>
            </div>

            <div id="loading" class="text-center py-16 text-slate-400">Loading expansion database...</div>
            <div id="errorMsg" class="hidden text-center py-10 text-rose-400 bg-rose-950/30 rounded-xl border border-rose-800/50 mb-6"></div>
            
            <div id="accordionContainer" class="space-y-4"></div>
        </div>

    </main>

    <!-- 弹窗：导出交换清单 -->
    <div id="modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-slate-100 flex justify-between items-center">
                <span>Standard Rarity Trade List</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
            </h3>
            <textarea id="tradeTextResult" class="w-full h-40 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-300 font-mono focus:outline-none" readonly></textarea>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm">Close</button>
                <button onclick="copyTradeText()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg text-sm">Copy Text</button>
            </div>
        </div>
    </div>

    <script>
        let userTradeData = JSON.parse(localStorage.getItem('tcg_trade_data') || '{"have": {}, "want": {}}');
        let currentRarity = '';
        let currentRarityLabel = '';

        function selectRarity(rarityKey, rarityLabel) {
            currentRarity = rarityKey;
            currentRarityLabel = rarityLabel;

            document.getElementById('activeRarityText').textContent = rarityLabel;
            document.getElementById('currentRarityBadge').classList.remove('hidden');
            document.getElementById('selectedRarityIndicator').textContent = `Active Filter: ${rarityLabel}`;

            const treeSection = document.getElementById('treeContainerSection');
            treeSection.classList.remove('hidden');
            treeSection.scrollIntoView({ behavior: 'smooth' });

            fetchCardsTree(rarityKey);
        }

        function resetRarity() {
            if (confirm('Switching rarity will collapse current expansion tree. Proceed?')) {
                currentRarity = '';
                currentRarityLabel = '';
                document.getElementById('currentRarityBadge').classList.add('hidden');
                document.getElementById('treeContainerSection').classList.add('hidden');
                document.getElementById('accordionContainer').innerHTML = '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function fetchCardsTree(rarity) {
            const container = document.getElementById('accordionContainer');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');

            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            container.innerHTML = '';

            try {
                const res = await fetch(`/api/cards?rarity=${rarity}`);
                const json = await res.json();

                if (!json.success) throw new Error(json.error || 'Failed to fetch cards');

                const fetchedSetsCache = json.data;
                loading.style.display = 'none';
                updateTotalTradeCount();

                if (!fetchedSetsCache || fetchedSetsCache.length === 0) {
                    container.innerHTML = `<div class="text-center py-16 text-slate-500 bg-slate-800/40 rounded-2xl border border-slate-700">No cards found for this standard rarity tag.</div>`;
                    return;
                }

                fetchedSetsCache.forEach((set, index) => {
                    const isOpen = index === 0;
                    const accordionId = `set-panel-${set.setId}-${index}`;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'bg-slate-800/60 border border-slate-700 rounded-2xl overflow-hidden shadow-lg transition-all';
                    
                    let packageHaveCount = 0;
                    let packageWantCount = 0;
                    set.cards.forEach(c => {
                        if (userTradeData.have[c.id]) packageHaveCount++;
                        if (userTradeData.want[c.id]) packageWantCount++;
                    });

                    wrapper.innerHTML = `
                        <button onclick="toggleAccordion('${accordionId}', this)" class="w-full px-6 py-4 flex justify-between items-center bg-slate-800 hover:bg-slate-750 transition-colors text-left">
                            <div class="flex items-center gap-3">
                                <span class="text-amber-400 font-mono font-bold text-sm">📁 ${set.setId}</span>
                                <span class="font-bold text-slate-100 text-base">${set.setName}</span>
                                <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-0.5 rounded-full font-mono">${set.totalCards} cards</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-xs flex gap-3 font-mono">
                                    ${packageHaveCount > 0 ? `<span class="text-emerald-400">Have: ${packageHaveCount}</span>` : ''}
                                    ${packageWantCount > 0 ? `<span class="text-rose-400">Want: ${packageWantCount}</span>` : ''}
                                </div>
                                <span class="transform transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}" id="arrow-${accordionId}">▼</span>
                            </div>
                        </button>

                        <div id="${accordionId}" class="${isOpen ? '' : 'hidden'} p-6 border-t border-slate-700/60 bg-slate-900/40">
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                ${set.cards.map(card => {
                                    const isHave = !!userTradeData.have[card.id];
                                    const isWant = !!userTradeData.want[card.id];

                                    return `
                                        <div class="bg-slate-800 rounded-xl overflow-hidden border ${isHave ? 'border-emerald-500/80 shadow-emerald-900/20' : isWant ? 'border-rose-500/80 shadow-rose-900/20' : 'border-slate-700'} hover:border-amber-400/50 transition-all group flex flex-col">
                                            <div class="aspect-[3/4] bg-slate-900 relative overflow-hidden flex items-center justify-center p-2">
                                                <img src="${card.image}" alt="${card.name}" loading="lazy" class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300">
                                                <div class="absolute top-2 left-2 flex flex-col gap-1">
                                                    ${isHave ? '<span class="bg-emerald-500 text-slate-950 text-[10px] font-bold px-1.5 py-0.5 rounded shadow">Have</span>' : ''}
                                                    ${isWant ? '<span class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">Want</span>' : ''}
                                                </div>
                                            </div>
                                            <!-- 彻底移除了底部的稀有度标签，只保留编号与卡名 -->
                                            <div class="p-3 flex flex-col flex-grow justify-between">
                                                <div>
                                                    <div class="text-xs text-amber-400 font-mono mb-1">${card.id}</div>
                                                    <h3 class="font-bold text-sm text-slate-100 truncate">${card.name}</h3>
                                                </div>
                                                <div class="mt-3 pt-2 border-t border-slate-700/50 flex justify-between gap-2">
                                                    <button onclick="toggleStatus('${card.id}', 'have')" class="flex-1 py-1 px-2 rounded text-xs font-semibold transition-colors ${isHave ? 'bg-emerald-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}">Have</button>
                                                    <button onclick="toggleStatus('${card.id}', 'want')" class="flex-1 py-1 px-2 rounded text-xs font-semibold transition-colors ${isWant ? 'bg-rose-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}">Want</button>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                    container.appendChild(wrapper);
                });

            } catch (err) {
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
                errorMsg.textContent = `Error: ${err.message}`;
            }
        }

        function toggleAccordion(panelId, btnElement) {
            const panel = document.getElementById(panelId);
            const arrow = btnElement.querySelector(`#arrow-${panelId}`);
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                panel.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        function toggleStatus(cardId, type) {
            if (type === 'have') {
                if (userTradeData.have[cardId]) delete userTradeData.have[cardId];
                else { userTradeData.have[cardId] = true; delete userTradeData.want[cardId]; }
            } else if (type === 'want') {
                if (userTradeData.want[cardId]) delete userTradeData.want[cardId];
                else { userTradeData.want[cardId] = true; delete userTradeData.have[cardId]; }
            }
            localStorage.setItem('tcg_trade_data', JSON.stringify(userTradeData));
            updateTotalTradeCount();
            if (currentRarity) fetchCardsTree(currentRarity);
        }

        function updateTotalTradeCount() {
            const total = Object.keys(userTradeData.have).length + Object.keys(userTradeData.want).length;
            document.getElementById('totalTradeCount').textContent = total;
        }

        function exportTradeList() {
            let text = `[Pokémon TCG Pocket Trade List]\n----------------------------------\n🟢 HAVE (Duplicates):\n`;
            const haveIds = Object.keys(userTradeData.have);
            text += haveIds.length === 0 ? `None\n` : haveIds.join(', ') + `\n`;
            text += `\n🔴 WANT (Looking for):\n`;
            const wantIds = Object.keys(userTradeData.want);
            text += wantIds.length === 0 ? `None\n` : wantIds.join(', ') + `\n`;
            text += `----------------------------------\nTrading equal rarities only!`;

            document.getElementById('tradeTextResult').value = text;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function copyTradeText() {
            document.getElementById('tradeTextResult').select();
            document.execCommand('copy');
            alert('Trade list copied to clipboard!');
        }

        updateTotalTradeCount();
    </script>
</body>
</html>
